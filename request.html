<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Say hi! / 1019</title>
<style>
  :root{--bg:#11110f;--fg:#f4f2ed;--muted:rgba(244,242,237,.66);--body:rgba(244,242,237,.82);--line:rgba(244,242,237,.24);--field:rgba(255,255,255,.025)}
  html[data-theme="light"]{--bg:#f1f0ec;--fg:#171715;--muted:rgba(23,23,21,.66);--body:rgba(23,23,21,.82);--line:rgba(23,23,21,.2);--field:rgba(0,0,0,.025)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  body{transition:background-color .35s ease,color .35s ease}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
  a{color:inherit;text-decoration:none}
  .page{position:relative;z-index:1;min-height:100svh;padding:28px 32px 42px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(64px,9vw,120px)}
  .mark{display:inline-block;font-size:12px;line-height:1.35;letter-spacing:.11em;text-transform:uppercase;font-weight:650}
  .theme-toggle{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);padding:0;cursor:pointer}
  .toggle-track{position:relative;width:38px;height:20px;border:1px solid var(--line);border-radius:999px}
  .toggle-knob{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg);transition:transform .3s ease}
  html[data-theme="light"] .toggle-knob{transform:translateX(18px)}
  .theme-icon{width:15px;height:15px;display:inline-flex} .theme-icon svg{width:100%;height:100%;stroke-width:1.8}
  main{display:grid;grid-template-columns:minmax(260px,.7fr) minmax(420px,1.3fr);gap:clamp(56px,8vw,128px);max-width:1220px;margin:0 auto}
  .intro{position:sticky;top:32px;align-self:start}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  h1{font-size:clamp(48px,5.2vw,74px);line-height:1;letter-spacing:-.05em;font-weight:520;margin:0 0 24px}
  .intro p{font-size:18px;line-height:1.55;color:var(--body);max-width:470px;margin:0}
  form{display:grid;grid-template-columns:1fr 1fr;gap:24px 20px;padding-bottom:32px}
  .field{display:flex;flex-direction:column;gap:9px}
  .field.full{grid-column:1/-1}
  label{font-size:12px;color:var(--muted)}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:0;background:var(--field);color:var(--fg);font:inherit;font-size:15px;padding:14px 15px;outline:none;transition:border-color .2s ease}
  input:focus,select:focus,textarea:focus{border-color:var(--fg)}
  textarea{min-height:170px;resize:vertical;line-height:1.5}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  option{background:var(--bg);color:var(--fg)}
  .actions{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:8px}
  button[type="submit"]{display:inline-flex;align-items:center;gap:11px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:14px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  button[type="submit"] svg{width:17px;height:17px;stroke-width:1.8}
  .note{font-size:12px;line-height:1.45;color:var(--muted);max-width:330px}
  .back{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-top:28px}
  .back:hover{color:var(--fg)} .back svg{width:16px;height:16px;stroke-width:1.8}
  @media(max-width:820px){
    .page{padding:22px}
    header{margin-bottom:60px}
    main{grid-template-columns:1fr;gap:44px}
    .intro{position:static}
  }
  @media(max-width:580px){
    .page{padding:18px}
    form{grid-template-columns:1fr}
    .field.full,.actions{grid-column:1}
    h1{font-size:48px}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <a class="mark" href="./concept-i.html">1019 / Jason Wu</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme"><span class="theme-icon" id="themeIcon" aria-hidden="true"></span><span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span></button>
  </header>
  <main>
    <section class="intro">
      <div class="eyebrow">Say hi!</div>
      <h1>Tell me what you’re working on.</h1>
      <p>A few details will help me understand the opportunity, scope, and timing before we connect.</p>
      <a class="back" href="./concept-i.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to 1019</a>
    </section>
    <form id="requestForm">
      <div class="field"><label for="name">Name *</label><input id="name" name="name" autocomplete="name" required /></div>
      <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
      <div class="field"><label for="company">Company</label><input id="company" name="company" autocomplete="organization" /></div>
      <div class="field"><label for="projectType">Project type</label><select id="projectType" name="projectType"><option value="Not specified">Select one</option><option>Product strategy</option><option>Interaction design</option><option>0-to-1 product development</option><option>Design leadership / advising</option><option>Other</option></select></div>
      <div class="field"><label for="timeline">Ideal start</label><select id="timeline" name="timeline"><option value="Not specified">Select one</option><option>As soon as possible</option><option>Within 1 month</option><option>Within 1–3 months</option><option>Later / exploring</option></select></div>
      <div class="field"><label for="budget">Approximate budget</label><select id="budget" name="budget"><option value="Not specified">Select one</option><option>Under $15k</option><option>$15k–$30k</option><option>$30k–$60k</option><option>$60k+</option><option>Not sure yet</option></select></div>
      <div class="field full"><label for="details">Tell me about the project *</label><textarea id="details" name="details" placeholder="What are you building, where are you in the process, and what kind of help are you looking for?" required></textarea></div>
      <div class="actions"><button type="submit">Prepare request<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button><span class="note" id="formNote">This opens a prefilled message in your email app so you can review it before sending.</span></div>
    </form>
  </main>
</div>
<script>
const root=document.documentElement;
const themeToggle=document.getElementById('themeToggle');
const themeIcon=document.getElementById('themeIcon');
function applyTheme(theme){
  root.dataset.theme=theme;
  const isLight=theme==='light';
  themeIcon.innerHTML=isLight?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/><path d="m4.93 4.93 1.41 1.41M17.66 17.66l1.41 1.41M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
}
applyTheme(localStorage.getItem('1019-theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
themeToggle.addEventListener('click',()=>{const next=root.dataset.theme==='light'?'dark':'light';applyTheme(next);localStorage.setItem('1019-theme',next)});
document.getElementById('requestForm').addEventListener('submit',event=>{
  event.preventDefault();
  const form=new FormData(event.currentTarget);
  const name=form.get('name');
  const subject=`Project request from ${name}`;
  const body=[
    `Name: ${name}`,
    `Email: ${form.get('email')}`,
    `Company: ${form.get('company') || 'Not specified'}`,
    `Project type: ${form.get('projectType')}`,
    `Ideal start: ${form.get('timeline')}`,
    `Approximate budget: ${form.get('budget')}`,
    '',
    'Project details:',
    form.get('details')
  ].join('\n');
  window.location.href=`mailto:jason@1019.co?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>
</body>
</html>
